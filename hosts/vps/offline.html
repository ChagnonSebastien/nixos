<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{.Host}} is taking a nap</title>
  <style>
    :root {
      --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #656d76;
      --accent: #16a34a; --accent-text: #ffffff; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0;
        --accent: #22c55e; --accent-text: #0d1117; --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px 32px; text-align: center;
    }
    .cat { font-size: 64px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: var(--muted); }
    .host { color: var(--text); font-weight: 600; word-break: break-all; }
    a.button {
      display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 10px;
      background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600;
    }
    a.button:hover { filter: brightness(1.08); }
    .retry { margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="cat" aria-hidden="true">🐈‍⬛🔌</div>
    <h1>Oopsy!</h1>
    <p><span class="host">{{.Host}}</span> is unreachable right now.</p>
    <p>Either the server is under maintenance, or a cat walked on the power bar switch.</p>
    <a class="button" href="https://status.chagnon.dev">Check the status page</a>
    <p class="retry">This page will retry on its own in a minute.</p>
  </main>
  <script>setTimeout(function () { location.reload(); }, 60000);</script>
</body>
</html>
